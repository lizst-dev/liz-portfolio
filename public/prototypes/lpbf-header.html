<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LPBF header prototype</title>
<style>
  html,body{margin:0;height:100%;background:#0b0c0e;overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  /* the printer window: only a hint of frame at the extreme edges */
  #fade{position:fixed;inset:0;background:#0b0c0e;opacity:1;pointer-events:none}
  #glass{position:fixed;inset:0;pointer-events:none;
    box-shadow:inset 0 0 0 5px #15171a, inset 0 0 0 7px #2a2d32, inset 0 0 140px 30px rgba(0,0,0,.78);
    background:
      linear-gradient(115deg,transparent 38%,rgba(255,255,255,.035) 45%,transparent 52%),
      radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.35) 100%);}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="stage"></div><div id="fade"></div><div id="glass"></div>
<script type="module">
import * as THREE from 'three';

const params = new URLSearchParams(location.search);
const FREEZE = params.has('freeze') ? parseFloat(params.get('freeze')) : null;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- timeline (seconds) ----------
const LAYERS = 5, H = 1.3, R = 1.75, BLADES = 8;
const L = 0.5;                       // powder surface height (stays constant: the plate moves down, not the arm)
const LIFT = 2.1;
const HF = 2.4, NF = 40, LASERS = 4;   // the finished part: full height, 40 fine layers (only the first 5 thick layers are shown being built)

// the rest are time-lapsed so the loop doesn't run for minutes. ?slow=N changes how many are slow.
const SLOW = params.has('slow') ? +params.get('slow') : LAYERS;
const SLOW_T = {laser: 2.5, lower: .5, sweep: 1.5}, FAST_T = {laser: .07, lower: .03, sweep: .1};

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.localClippingEnabled = true;

const scene = new THREE.Scene();
// reflections for the silver metal (applied to the part only, not the powder)
const envTex = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture;
scene.background = new THREE.Color(0x0b0c0e);
scene.fog = new THREE.FogExp2(0x0b0c0e, 0.03);
const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 60);

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0xaab3bf, 0x2a2d33, 1.9));
const rim = new THREE.DirectionalLight(0xc9d3df, 1.5); rim.position.set(-4, 5, -3); scene.add(rim);


// ---------- procedural powder texture ----------
function powderTexture() {

  const g = c.getContext('2d'); const img = g.createImageData(512, 512);

    const v = 120 + Math.random() * 110;
    img.data[i] = v; img.data[i+1] = v; img.data[i+2] = v * 1.03; img.data[i+3] = 255;

const powderTex = powderTexture();

// ---------- noise / heightfield ----------

const CRATER_R = 2.6;
function bedHeight(x, z, withCrater) {

}

function makeBed(fn) {

  const p = g.attributes.position;

const sweepPlane = new THREE.Plane(new THREE.Vector3(-1, 0, 0), -20);
const powderMat = new THREE.MeshStandardMaterial({map: powderTex, bumpMap: powderTex, bumpScale: 3.2, color: 0x80858c, roughness: 1, metalness: 0});

  const p = g.attributes.position, uv = g.attributes.uv;

}
const discA = new THREE.Mesh(discGeo(), powderMat); discA.position.y = L; scene.add(discA);
const discC = new THREE.Mesh(discGeo(), coverMat); discC.position.y = L; scene.add(discC);
const armMat = new THREE.MeshStandardMaterial({color: 0x5d636b, roughness: .45, metalness: .6});
const recoater = new THREE.Group();
const armBody = new THREE.Mesh(new THREE.BoxGeometry(.1, .22, 5.4), armMat); armBody.position.set(.06, .16, 0);
const armBlade = new THREE.Mesh(new THREE.BoxGeometry(.03, .07, 5.4), new THREE.MeshStandardMaterial({color: 0x9aa0a8, roughness: .3, metalness: .9})); armBlade.position.set(-.01, .02, 0);
const mound = new THREE.Mesh(new THREE.CylinderGeometry(.11, .11, 5.0, 14), powderMat); mound.rotation.x = Math.PI / 2; mound.position.set(-.16, .1, 0);
recoater.add(armBody, armBlade, mound); recoater.visible = false; scene.add(recoater);
const ARM_X0 = -CRATER_R - .5, ARM_X1 = CRATER_R + .5;

// ---------- impeller, built layer by layer ----------
const layers = [];

  const hole = new THREE.Path(); hole.absarc(0, 0, .15, 0, Math.PI * 2, true); hub.holes.push(hole);

}

    g.rotateX(-Math.PI / 2); g.translate(0, i * d, 0);

    const ends = []; for (let j = 0; j + 1 < g.groups.length; j += 2) ends.push(g.groups[j + 1].start + g.groups[j + 1].count);

const buildPartObj = buildPart(LAYERS, H), fullPartObj = buildPart(NF, HF);
const partGroup = buildPartObj.grp, dh = buildPartObj.d;
buildPartObj.arr.forEach(m => layers.push(m));
fullPartObj.grp.visible = false; fullPartObj.arr.forEach(m => m.visible = true);
const GROUP_Y_FULL = L - .02 - HF;   // final part: top just under the powder surface

// ---------- blown powder (finale) ----------
const DUST = 3200, dPos = new Float32Array(DUST * 3), dCol = new Float32Array(DUST * 3), dVel = new Float32Array(DUST * 3), dLife = new Float32Array(DUST), dMax = new Float32Array(DUST);
const dGeo = new THREE.BufferGeometry();
dGeo.setAttribute('position', new THREE.BufferAttribute(dPos, 3)); dGeo.setAttribute('color', new THREE.BufferAttribute(dCol, 3));
function softTex() { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'); const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); }
const dust = new THREE.Points(dGeo, new THREE.PointsMaterial({size: .085, map: softTex(), vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true}));
dust.frustumCulled = false; scene.add(dust);
let dHead = 0;

  dPos.set([Math.cos(a) * r, y + .02, Math.sin(a) * r], i * 3);
  dVel[i * 3] = 2.5 + Math.random() * 4; dVel[i * 3 + 1] = .2 + Math.random() * 1.6; dVel[i * 3 + 2] = -1.4 + Math.random() * 1.8;

// ---------- laser: trail, glow, sparks ----------
const TRAIL_MAX = 9000;
const trailPos = new Float32Array(TRAIL_MAX * 6), trailCol = new Float32Array(TRAIL_MAX * 6), trailBirth = new Float32Array(TRAIL_MAX);
const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3)); trailGeo.setAttribute('color', new THREE.BufferAttribute(trailCol, 3));
const trail = new THREE.LineSegments(trailGeo, new THREE.LineBasicMaterial({vertexColors: true, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false}));
trail.frustumCulled = false; scene.add(trail);
let trailHead = 0;

function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,250,235,1)'); gr.addColorStop(.18, 'rgba(255,200,120,.85)'); gr.addColorStop(.5, 'rgba(255,120,30,.25)'); gr.addColorStop(1, 'rgba(255,90,10,0)');

const glowTex = glowTexture();
const glows = Array.from({length: LASERS}, () => { const g = new THREE.Sprite(new THREE.SpriteMaterial({map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true})); g.scale.set(.42, .42, 1); scene.add(g); return g; });
const laserLights = Array.from({length: LASERS}, () => { const l = new THREE.PointLight(0xff9a3c, 0, 4.5, 2); scene.add(l); return l; });

const SP = 700;
const spPos = new Float32Array(SP * 6), spCol = new Float32Array(SP * 6);
const spVel = new Float32Array(SP * 3), spLife = new Float32Array(SP), spMax = new Float32Array(SP);
const spGeo = new THREE.BufferGeometry();

// ---------- sizing ----------

  // blown powder
  if (blowP > .02 && blowP < .93) for (let n = 0; n < 40; n++) emitDust(L + bedY);
  for (let i = 0; i < DUST; i++) {
    if (dLife[i] > 0) {
      dLife[i] -= dt; dVel[i * 3] += 2.2 * dt; dVel[i * 3 + 1] -= .35 * dt;
      dPos[i * 3] += dVel[i * 3] * dt; dPos[i * 3 + 1] += dVel[i * 3 + 1] * dt; dPos[i * 3 + 2] += dVel[i * 3 + 2] * dt;
      const a = Math.max(0, dLife[i] / dMax[i]) * .2; dCol[i * 3] = a * .9; dCol[i * 3 + 1] = a * .92; dCol[i * 3 + 2] = a;
    } else { dCol[i * 3] = dCol[i * 3 + 1] = dCol[i * 3 + 2] = 0; }
  }
  dGeo.attributes.position.needsUpdate = true; dGeo.attributes.color.needsUpdate = true;
  // fade trail
  const LIFE = slowLayer ? .5 : .16;
  for (let i = 0; i < TRAIL_MAX; i++) {
    const age = t - trailBirth[i] + (t < trailBirth[i] ? T_LOOP : 0);
    const a = age < 0 || age > LIFE ? 0 : 1 - age / LIFE;
    const r = a, g = Math.pow(a, 1.6) * .72, b = Math.pow(a, 4) * .45;
    for (let v = 0; v < 2; v++) { trailCol[i * 6 + v * 3] = r * 1.0; trailCol[i * 6 + v * 3 + 1] = g * 1.0; trailCol[i * 6 + v * 3 + 2] = b * 1.0; }
  }
  trailGeo.attributes.position.needsUpdate = true; trailGeo.attributes.color.needsUpdate = true;

  // sparks
  for (let i = 0; i < SP; i++) {
    if (spLife[i] > 0) {
      spLife[i] -= dt; spVel[i * 3 + 1] -= 7.5 * dt;
      const x = spPos[i * 6 + 3] + spVel[i * 3] * dt, y = spPos[i * 6 + 4] + spVel[i * 3 + 1] * dt, z = spPos[i * 6 + 5] + spVel[i * 3 + 2] * dt;
      spPos[i * 6] = x - spVel[i * 3] * .022; spPos[i * 6 + 1] = y - spVel[i * 3 + 1] * .022; spPos[i * 6 + 2] = z - spVel[i * 3 + 2] * .022;
      spPos[i * 6 + 3] = x; spPos[i * 6 + 4] = y; spPos[i * 6 + 5] = z;
      const a = Math.max(0, spLife[i] / spMax[i]);
      spCol.set([1.6 * a, 1.0 * a * a, .35 * a * a * a, 1.6 * a, 1.0 * a * a, .35 * a * a * a], i * 6);
    } else spCol.fill(0, i * 6, i * 6 + 6);
  }
  spGeo.attributes.position.needsUpdate = true; spGeo.attributes.color.needsUpdate = true;

  // lights + glow
  const flick = .85 + Math.random() * .3;
  for (let j = 0; j < LASERS; j++) {
    const h = heads[j];
    laserLights[j].intensity = laserOn && h ? .75 * flick : 0;
    if (h) { laserLights[j].position.set(h.x * .8, L + .8, h.z * .8); glows[j].position.set(h.x, topY + .05, h.z); }
    glows[j].visible = laserOn && !!h; glows[j].material.opacity = flick;
  }

  // tiny handheld-free drift: breathing, so the shot isn't dead still
  const sway = Math.sin(t / T_LOOP * Math.PI * 2) * .06;
  const cp = ease(blowP);
  camera.position.set(sway, camBaseY - 1.0 * cp, camBaseZ + 2.2 * cp); camera.lookAt(0, 1.0 - 1.55 * cp, 0);

  composer.render();
  requestAnimationFrame(frame);
}
frame();
</script>
